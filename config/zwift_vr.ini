; VR mod for Zwift settings - read once when the mod loads into Zwift.
; Edit, then restart Zwift + re-run zvr_loader.exe to apply.
;
[setup]
; Read by zvr_loader.exe when it starts and each time Zwift closes.
; 1 = VR graphics settings in Zwift: effects that cost performance or look wrong in a headset (shadows, bloom, speed
; blur, sun rays, ambient occlusion...) are turned off (config\zwift-vr-graphics.txt, built into the loader). Zwift's
; own settings are kept as backups, and the VR ones go back in after a Zwift update. 0 = Zwift's own settings
; (put back from the backups; "Restore Zwift graphics.cmd" does the same once).
vr_graphics = 1
; 1 = Windows runs Zwift on your high-performance graphics card (laptops with two graphics chips; the same as Windows
; Settings > System > Display > Graphics > ZwiftApp.exe > High performance). Only set when Windows has no choice
; for Zwift yet - one you made there is left alone. 0 = never touch it.
gpu_high_performance = 1

[vr]
; immersive = your head drives Zwift's camera, you're in the world (phase 3)
; screen    = Zwift on a virtual screen in front of you (phase 1)
; Toggle live with Ctrl+Shift+F10.
mode = immersive
; 1 = follow Zwift: virtual screen in its menus (login, pairing, route pick), immersive once a ride starts, and
; back to the screen when the ride ends (read from Zwift's own log). Ctrl+Shift+F10 still overrides until the
; next ride start/end. In-ride menus (Esc, mid-ride pairing) don't switch. 0 = always `mode` above.
auto_screen_in_menus = 1
; Zwift world units per real metre = 100 x this. Raise it if the world feels too small, lower if too big.
world_scale = 1.0
; Eye separation: 1 = your real IPD, 0.5 = half (milder 3D), 0 = none (flat, always fuses).
; Live: Ctrl+Shift+PageUp / PageDown = +/- 0.25.
parallax = 1.0
; 1 = Zwift's camera sits where your head was when the headset came on (and after Ctrl+Shift+F1 or a
; headset recentre), so leaning over the bars doesn't push you into the chase camera. 0 = the runtime's origin.
recentre_position = 1
; While Zwift's camera moves, one eye per Zwift frame means the two eyes see the world from points
; 20-50 cm apart, so near things can double. 1 = while moving, both eyes get each frame (no 3D, but clean
; and smoother); 3D returns 1 s after you stop. 0 = 3D all the time (preferred on the Quest 2, 2026-11-08).
; 1 preferred on the Quest 3 laptop (2026-11-09): near things stuttered at ~22 new images per eye per second.
; 2 = always: both eyes get every frame even when you're stopped, so riders passing you move as smoothly as
; Zwift's frame rate allows - but no 3D at all. 2 preferred on the Quest 3 laptop (2026-11-10): with 1, riders
; passing while stopped jumped (~20 new images per eye per second). No hotkey: change it here and restart Zwift.
coherent_when_moving = 2
; Zwift shakes its camera on bridges, cobbles and gravel. In a headset that shakes the whole world around you, so
; the mod filters the shake out of Zwift's camera and keeps its normal movement and turning. Seconds of filtering:
; 0.1 = default, higher = steadier (try 0.2), 0 = Zwift's camera exactly as it is. Logged as "steady_camera".
steady_camera = 0.1
; 1 = send the headset only the part of each eye image its display can show. Live: Ctrl+Shift+Insert.
crop_to_eye_fov = 1
; Ctrl+Shift+Delete makes Zwift's window this wide (height keeps its shape) - bigger than the screen - so each
; eye image is sharper (Zwift already renders its scene at its own resolution setting, e.g. 3840x2160, and
; otherwise shrinks it into the window). Only the top-left of Zwift is visible on the monitor while big.
; Press again to restore. Each eye must fit the headset's swapchain limit (logged as "max swapchain image"; 4096 on
; a Quest 3 over Meta Horizon Link).
big_window_width = 3840
; 1 = big automatically when a ride starts, normal size again in Zwift's menus (read from Zwift's log, like
; auto_screen_in_menus), so menus stay fully on the monitor. Ctrl+Shift+Delete still overrides until the next ride
; start / end. 0 = only the hotkey.
auto_big_window = 1
; Immersive eye images are filtered down to the headset's own resolution before they're sent (the headset's
; own shrinking is plain bilinear, which makes distant detail shimmer). 1.0 = the runtime's recommended size
; (Meta Horizon Link: its Graphics Preferences render resolution, so that slider matters again), 1.2 = a bit more detail,
; 0 = off (Zwift's pixels as they are). Logged as "headset recommends WxH per eye".
eye_resolution = 1.0

[render]
; 0 = no shadows: the mod skips every draw into Zwift's shadow maps (sun + headlight). Saves CPU
; (~3100 draw calls per frame) and avoids shadow artifacts in VR. 1 = Zwift's normal shadows.
shadows = 0
; 0 = no water reflections: the mod skips Zwift's whole water-reflection render pass (a second scene
; render) in immersive mode. 1 = reflections on (kept on Zwift's own camera, so they don't slide).
reflections = 0
; Live toggles (Zwift focused): Ctrl+Shift+F5 shadows, Ctrl+Shift+F3 reflections,
; Ctrl+Shift+F4 deferred-lighting rays fixed/legacy (A/B for the "lighting slides with my head" fix).

; The headset runtime is NOT chosen here: Zwift runs as admin, and the OpenXR loader
; ignores the XR_RUNTIME_JSON override in elevated processes. Set the *system* active
; OpenXR runtime instead (Pimax Play settings, or PimaxXR Control Center).

[hud]
; Immersive mode: take Zwift's HUD (power, time, map, rider list, turn arrows...) out of the eye images and show
; it on flat cards that stay put in the world around your bars - sharper and not stuck to the lens edges.
; 1 = on (Ctrl+Shift+F9 toggles live), 0 = HUD painted into the eye images as before.
enabled = 1
; How the split works: Zwift draws its finished scene into the window, then the HUD on top. The mod snapshots
; the window just before the HUD's first draw. This is how many window draws come before it (the scene
; composite). The log's "hud: ... window draws per frame" line shows the total. If the cards show the whole
; world instead of just the HUD, raise this by 1; if part of the HUD is missing from them, lower it.
composite_draws = 1
; 1 = clean card backgrounds: right after the snapshot the window's alpha is zeroed, so Zwift's HUD leaves its own
; coverage there and the world is taken back out of translucent panels (otherwise they show a dimmed copy of the
; scenery that moves with your head). Needs a window with alpha (logged as "hud: window alpha bits N").
window_alpha = 1
; Cards: cardN = x0 y0 x1 y1  right up ahead  width
;   x0 y0 x1 y1  the part of Zwift's window to show, as fractions (0 0 = top-left, 1 1 = bottom-right)
;   right up ahead  card centre in metres from your head's home position (Ctrl+Shift+F1 re-homes)
;   width        card width in metres (height follows the part's shape); cards turn to face you
; Up to 8. With none, the whole HUD is one card 1.2 m wide, 1 m ahead, 10 cm below eye level.
; Ctrl+Shift+F7 also saves the cut-out HUD (%LOCALAPPDATA%\zwift-vr\hud-*.rgba) to measure the parts on.
; Measured on a 16:9 Zwift free ride (2026-11-09, hud-175809). The centre stays clear for the road; cards sit
; 1.1 m ahead (closer gets uncomfortable to focus on in a headset). Empty parts are simply transparent.
; Where two cards' parts overlap, both cards show it, so parts are kept apart where they can be.
; 2026-11-10: achievement banners ("WEEKLY GOAL MET!", hud-160008) run from their badge at x 0.18 to their text's end
; at 0.78 - card6 was widened from 0.30-0.70. Chat pop-ups (hud-162405) sit left of Zwifters Nearby at x 0.69-0.835,
; partly over the minimap's bottom edge, so the minimap, the chat column and Zwifters Nearby are now one card (card4)
; laid out as Zwift draws them, and the centre card is narrowed to stay clear of it. One overlap is left: card4's
; empty lower-left corner and card6's right end, where only the tail of a long banner ever shows up twice.
; 2026-11-11 (hud-161715, -165339, -165852): the unlock banner ("YOU HAVE UNLOCKED THE ...") runs the full width of
; the window - see card6_wide. The segment duel (you vs the rider ahead) hangs below the top bar down to y 0.36, so
; card3 reaches 0.37 (its top edge stays put). The power-up ring's icon pokes up to y 0.01, and Zwift's notification
; line ("Leveled up!", Ride On thumbs-up) sits at the very bottom right. card6 now ends at x 0.80, so the jersey
; icons left of rider names (x 0.83) and that thumbs-up show in card4 only.
; cardN_wide = x0 y0 x1 y1: a bigger part this card shows while a full-width banner is on screen. The mod watches
; banner_probe (default: the wide part left of the card's own); when Zwift covers 40% of it, the card widens (same
; scale, nothing moves) and any other card overlapping it is cut off above it for those seconds - card4's lowest
; rows, which the banner covers on the monitor too. One card can have it. banner_probe skips the MENU button that
; shows bottom-left during drop-ins (y 0.93-0.985): on every capture so far it reads 0% without a banner, 86-100%
; with one.
card1 = 0.008 0.015 0.170 0.215   -0.52  0.16  1.1  0.34   ; power, cadence, avg power, kJ
card2 = 0.205 0.000 0.310 0.205   -0.30  0.276 1.1  0.12   ; power-up ring
card3 = 0.330 0.015 0.670 0.370    0.00  0.203 1.1  0.62   ; speed, distance, elevation, time, climb profile, segment duel
card4 = 0.685 0.015 0.998 1.000    0.50 -0.102 1.1  0.45   ; minimap + route profile, chat pop-ups, Zwifters nearby
card5 = 0.008 0.272 0.170 0.675   -0.58 -0.18  1.1  0.25   ; segment / live results
card6 = 0.170 0.690 0.800 0.998   -0.022 -0.34 1.1  0.916  ; turn choices, notifications, achievement banners
card6_wide = 0.000 0.690 1.000 0.998                       ; full-width banners ("YOU HAVE UNLOCKED THE ...")
banner_probe = 0.000 0.760 0.170 0.900
card7 = 0.315 0.380 0.685 0.700    0.00  0.00  1.4  0.555  ; centre prompts (drop-in "PEDAL", countdowns, Ride Ons)
; Every card's angle from straight ahead x this, same distance from you: 1 = exactly the positions above, 1.3 = the
; side cards ~31-37 deg out, the top card ~17 deg up, the bottom one ~22 deg down (clear of the road; the centre
; prompts stay put). 1.3 picked live on the Quest 3 (2026-11-10). Live: Ctrl+Shift+] further out, Ctrl+Shift+[
; closer in, 0.1 per press (logged).
spread = 1.3

[screen]
; distance from your head to the virtual screen, metres
distance = 2.0
; screen width, metres (height follows Zwift's window aspect ratio)
width = 2.6
; screen centre height relative to your head when the view was last recentred, metres
height = 0.0
; crop Zwift's frame to this aspect ratio, keeping the centre ("16:9", "21:9", "1.6", or 0 = off).
; Useful when Zwift runs on an ultrawide monitor. If HUD elements at the edges get cut off,
; set 0 and run Zwift windowed at a 16:9 size instead.
crop_aspect = 16:9

[depth]
; 3D from Zwift's depth buffer: 1 = on, 0 = flat screen
; (screen mode only; experimental and parked - leave at 0)
stereo = 0
; your IPD in mm. Distant scenery gets this much left/right separation, so it reads as infinitely far.
ipd_mm = 63
; 0..2 - scales the effect (1.0 = distant scenery a full IPD apart). Live: Ctrl+Shift+Up/Down.
strength = 0.5
; metres: things this far from Zwift's camera sit exactly on the virtual screen;
; nearer pops out (limited), farther recedes behind it. 2.5 ~ your own rider in the default camera.
convergence = 2.5
